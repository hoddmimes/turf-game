import groovy.json.JsonSlurper

plugins {
    id 'java'
}

subprojects {
    group 'com.hoddmimes.turfgame'
    version '1.1'

    // Defer until the subproject has applied the java plugin; configuring the
    // extension directly here would hit the root project instead.
    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }

    task turfVersion() {
        def jsonSlurper = new JsonSlurper()

        def build = jsonSlurper.parse(new File("$project.rootDir/version.json"))
        //print( "$build" )
        ext.version = { "$build.major" + "." + "$build.minor" }
    }
}

allprojects {
        repositories {
            maven {
                url "https://maven.geotoolkit.org"
            }

            mavenCentral()
            maven {
                url "https://repo1.maven.org/maven2/"
            }
            maven {
                url "https://repo.osgeo.org/repository/release/"
            }
            maven {
                url "https://repo.osgeo.org/repository/snapshot/"
            }
            maven {
                url "https://repo.opengeo.org"
            }
        }
}
